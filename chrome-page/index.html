<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-links">
            <a href="#" class="nav-link">Gmail</a>
            <a href="#" class="nav-link">Images</a>
            <div class="nav-icon">

                </svg>
            </div>
            <div class="nav-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <circle cx="5" cy="5" r="2" fill="white"/>
                    <circle cx="12" cy="5" r="2" fill="white"/>
                    <circle cx="19" cy="5" r="2" fill="white"/>
                    <circle cx="5" cy="12" r="2" fill="white"/>
                    <circle cx="12" cy="12" r="2" fill="white"/>
                    <circle cx="19" cy="12" r="2" fill="white"/>
                    <circle cx="5" cy="19" r="2" fill="white"/>
                    <circle cx="12" cy="19" r="2" fill="white"/>
                    <circle cx="19" cy="19" r="2" fill="white"/>
                </svg>
            </div>
            <div class="profile-icon">
                <div class="profile-circle">A</div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Google Logo -->
        <div class="logo">Google</div>

        <!-- Search Bar -->
        <div class="search-container">
            <div class="search-bar">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="#5f6368"/>
                </svg>
                <input type="text" placeholder="Search Google or type a URL" class="search-input">
                <div class="search-icons">
                    <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" fill="#5f6368"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" fill="#5f6368"/>
                    </svg>
                    <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M12 8.5c-1.84 0-3.48.96-4.34 2.42L9.24 12l-1.58 1.08C8.52 14.54 10.16 15.5 12 15.5c1.84 0 3.48-.96 4.34-2.42L14.76 12l1.58-1.08C15.48 9.46 13.84 8.5 12 8.5zM12 7c2.73 0 5.06 1.66 6 4-0.94 2.34-3.27 4-6 4s-5.06-1.66-6-4c0.94-2.34 3.27-4 6-4zm0 2.5c-0.83 0-1.5 0.67-1.5 1.5s0.67 1.5 1.5 1.5 1.5-0.67 1.5-1.5-0.67-1.5-1.5-1.5z" fill="#5f6368"/>
                        <circle cx="12" cy="11" r="1.5" fill="#5f6368"/>
                    </svg>
                    <div class="ai-mode">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                            <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="#5f6368"/>
                        </svg>
                        <span>AI Mode</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Shortcuts -->
        <div class="shortcuts">
            <div class="shortcut">
                <div class="shortcut-icon youtube">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                        <path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 5c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z" fill="white"/>
                    </svg>
                </div>
                <div class="shortcut-label">youtube</div>
            </div>
            <div class="shortcut">
                <div class="shortcut-icon chatgpt">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="8" stroke="white" stroke-width="2" fill="none"/>
                        <path d="M12 8v8M8 12h8" stroke="white" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="shortcut-label">Chatgpt</div>
            </div>
            <div class="shortcut">
                <div class="shortcut-icon add">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="white"/>
                    </svg>
                </div>
                <div class="shortcut-label">Add shortcut</div>
            </div>
        </div>
    </main>

    <!-- Customize Button -->
    <div class="customize-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="white"/>
        </svg>
        <span>Customize Chrome</span>
    </div>
</body>
</html>
